apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-mcp-registry
spec:
  title: "Kong MCP — Registry & Governance"
  description: >
    Centralize MCP server distribution with the Konnect MCP Registry. Create a
    registry, publish server entries, expose it read-only through Kong, and wire
    IDE clients to auto-discover approved servers — no manual mcp.json editing required.
  publish:
    image: $(image_repository)/lab-mcp-registry-files:$(workshop_version)
  workshop:
    files:
    - image:
        url: $(image_repository)/lab-mcp-registry-files:$(workshop_version)
      includePaths:
      - /workshop/**
      - /README.md
  session:
    namespaces:
      budget: small
    applications:
      console:
        enabled: true
      editor:
        enabled: true
    env:
    - name: PROXY
      value: ""
    - name: KONNECT_TOKEN
      value: ""
    - name: KONNECT_PUBLISH_TOKEN
      value: ""
