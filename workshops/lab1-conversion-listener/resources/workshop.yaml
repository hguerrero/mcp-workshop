apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: lab-mcp-conversion
spec:
  title: "Kong MCP — Lab 1: Conversion Listener"
  description: >
    Turn any REST API into an MCP server using Kong's AI MCP Proxy Plugin in
    conversion-listener mode. No upstream changes required. Includes a Mocking
    Plugin to simulate a Marketplace API with users and orders tools.
  vendor: konghq.com
  authors:
  - Kong Technical Product Marketing
  difficulty: beginner
  duration: 90m
  tags:
  - kong
  - mcp
  - model-context-protocol
  - ai
  - gateway
  - conversion-listener
  url: https://github.com/kong/mcp-workshop
  publish:
    image: docker.io/hguerreroo/lab-mcp-conversion-files:latest
  workshop:
    files:
    - image:
        url: docker.io/hguerreroo/lab-mcp-conversion-files:latest
      includePaths:
      - /workshop/**
      - /exercises/**
      - /README.md
  session:
    namespaces:
      budget: small
      security:
        policy: baseline
    applications:
      workshop:
        layout: none    
      console:
        enabled: false
      docker:
        enabled: false
      editor:
        enabled: false
      registry:
        enabled: false
      terminal:
        enabled: false
      vcluster:
        enabled: false
    ingresses:
    - name: mcp-inspector
      port: 6274
      host: mcp-inspector-service
      protocol: TCP
    dashboards:
    - name: Instructions
      url: /workshop/    
    - name: MCP Inspector
      url: "$(ingress_protocol)://mcp-inspector-$(session_namespace).$(ingress_domain)/"      
  environment:
    objects:
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-inspector
        labels:
          app: mcp-inspector
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: mcp-inspector
        template:
          metadata:
            labels:
              app: mcp-inspector
          spec:
            containers:
            - name: mcp-inspector
              image: ghcr.io/modelcontextprotocol/inspector:latest
              env:
              - name: HOST
                value: "0.0.0.0"
              - name: MCP_AUTO_OPEN_ENABLED
                value: "false"
              # It is highly recommended to set an auth token for security
              - name: DANGEROUSLY_OMIT_AUTH
                value: "true"
              ports:
              - containerPort: 6274
                name: ui
              - containerPort: 6277
                name: proxy
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
    - apiVersion: v1
      kind: Service
      metadata:
        name: mcp-inspector-service
      spec:
        selector:
          app: mcp-inspector
        type: ClusterIP
        ports:
        - port: 6274
          targetPort: 6274
          name: ui
        - port: 6277
          targetPort: 6277
          name: proxy
